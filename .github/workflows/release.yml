name: release.yml
on:
  workflow_dispatch:

jobs:
  buildExtension:
    name: Build and Package VSCode Extension
    runs-on: ubuntu-latest
    steps:
      - name: Setup Repository
        uses: actions/checkout@v6

      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '>=v21.21.1'
      
      - name: Build
        run: |
          npm run startpackagepipeline

      - name: Package
        run: |
          mkdir ext
          EXTVER="$(jq ".version" extension/package.json | tail -c +2 | head -c -2)"
          cp ./vscintegratedtwitchchat-${EXTVER}.vsix ./ext/vscintegratedtwitchchat-${EXTVER}.vsix
          echo ${EXTVER} > ext/debuggerlatestextension.txt

      - uses: actions/upload-artifact@v4
        with:
          path: ./ext
          name: extension
          overwrite: true

  release:
    name: release
    runs-on: ubuntu-latest
    needs:
      - buildExtension
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: extension
          path: ./ext

      - name: zip release
        run: |
          sudo apt install zip
          cd ./Release
          zip -r ../Release.zip .
          cd ../
          
          echo "EXT_VER=$(jq ".version" extension/package.json | tail -c +2 | head -c -2)" >> $GITHUB_ENV
          
          wget https://github.com/mcb5637/S5Updater/releases/download/nightly/HashFileBuilder
          chmod u+x HashFileBuilder 
          ./HashFileBuilder LuaDebuggerFile.dll ./Release/LuaDebugger.dll > ./debuggerhashes.txt

      - name: Delete tag
        run: gh release delete nightly --cleanup-tag -y || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          body: "latest code from master"
          prerelease: true
          files: |
            ./Release.zip
            ./ext/S5LuaDebuggerAdaptor-${{ env.EXT_VER }}.vsix
            ./ext/debuggerlatestextension.txt
            ./debuggerhashes.txt
          name: nightly
          tag_name: nightly
          fail_on_unmatched_files: true
          target_commitish: master
          generate_release_notes: false
          append_body: false
          make_latest: false