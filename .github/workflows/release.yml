name: release.yml
on:
  workflow_dispatch:

jobs:
  buildExtension:
    name: Build and Package VSCode Extension
    runs-on: ubuntu-latest
    steps:
      - name: Setup Repository
        uses: actions/checkout@v7

      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '>=v21.21.1'
      
      - name: Build
        run: |
          npm run startpackagepipeline

      - name: Get Version
        run: |
          echo "EXTVER=$(jq -r '.version' package.json)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          path: vscintegratedtwitchchat-${{ env.EXTVER }}.vsix
          name: extension
          compression-level: 9
          overwrite: true
          retention-days: 5

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - buildExtension
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extrahiere Version
        run: |
          echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV

      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: extension
          path: .
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Release v${{ env.VERSION }}"
          draft: false
          prerelease: false
          files: "vscintegratedtwitchchat-${{ env.VERSION }}.vsix"